            max-width: 1400px;

         /* HEADER */
        .admin-section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            margin: 55px 38px 35px;
        }

        .admin-section-text h2 {
            margin: 0 0 10px;

            font-size: 30px;
            line-height: 1.1;
            font-weight: 700;

            color: #17212b;
        }

        .admin-section-text p {
            margin: 0;

            font-size: 16px;
            line-height: 1.3;

            color: #8e6262;
        }

        .admin-action-btn {
            border: none;

            background: #ed1c24;
            color: white;

            padding: 17px 28px;

            font-size: 16px;
            line-height: 1.2;
            font-weight: bold;

            cursor: pointer;

            margin-top: 2px;
        }

        .admin-action-btn:hover {
            background: #c9151c;
        }       

        .orders-container {

            background: white;

            border-radius: 8px;

            overflow-x: auto;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.08);

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 900px;

        }


        th {

            color: white;

            padding: 15px;

        td {

            border-bottom: 1px solid #eee;

            font-size: 14px;

        }


        tr:hover {

        }


        .order-id {

            font-weight: bold;

            color: #ed1c24;

        }


        .total {

            font-weight: bold;
            color: #ed1c24;

            white-space: nowrap;

        }


        .status {

            padding: 7px 10px;

            border: 1px solid #ccc;

            border-radius: 4px;

            font-weight: bold;

            cursor: pointer;

        }


        .details-button {

            padding: 7px 12px;

            border: 1px solid #ccc;

            background: white;

            cursor: pointer;

        }


        .details-button:hover {

            background: #eee;

        }

        .validate-order-btn {
            margin-left: 8px;
            padding: 7px 12px;
            border: none;
            background: #28a745;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .validate-order-btn:hover {
            background: #218838;
        }


        .empty {

            text-align: center;

            padding: 50px;

            color: #777;

        }


        /* fenêtre détail */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.45);

            align-items: center;

            justify-content: center;

            z-index: 1000;

        }


        .modal-content {

            background: white;

            width: 90%;

            max-width: 600px;

            padding: 30px;

            border-radius: 8px;

        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .close {

            border: none;

            background: none;

            font-size: 28px;

            cursor: pointer;

        }


        .customer-info p {

            margin: 8px 0;

        }


        .order-info {
            margin-bottom: 25px;
        }

        .order-info p {
            margin: 8px 0;
        }


        .products-title {
            margin-top: 25px;
            margin-bottom: 15px;
        }


        .products-table {
            width: 100%;
            border-collapse: collapse;
        }


        .products-table th {
            background: #f3f3f3;
            color: #222;
            padding: 10px;
        }


        .products-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }


        .admin-product {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .admin-product img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }


        .order-total {
            display: flex;
            justify-content: space-between;

            margin-top: 25px;
            padding-top: 15px;

            border-top: 2px solid #222;

            font-size: 18px;
        }


        .order-total strong {
            color: #ed1c24;
            font-size: 22px;
        }


        .order-status {
            margin-top: 20px;
            font-size: 16px;
        }

    </style>

</head>

<header>
    <h1>🛍️ TechShop </h1>

    <nav>
        <button class="adminButton" onclick="window.location.href='index.html'">
            🛍️ Accueil
        </button>

        <button class="adminButton" onclick="window.location.href='admin.html'">
            🧑‍💼 Admin
        </button>

        <button class="adminButton" onclick="window.location.href='historique.html'">
            📊 Historique
        </button>         
    
    </nav>

</header>

<body>

<div class="admin-top">

    <h1 class="admin-title">
        🧑‍💼 Administration de la boutique🔐
    </h1>

    <nav class="admin-menu">

        <a href="admin.html" class="active">
            🧺 Commandes
        </a>

        <a href="admin-produits.html">
            📦 Produits
        </a>

    </nav>

</div>

<div class="admin-container">

    <div class="admin-section-header">

        <div class="admin-section-text">
            <h2>Gestion des commandes</h2>
            <p>Consulter et gérer les commandes reçues.</p>
        </div>

        <button class="admin-action-btn" onclick="loadOrders()">
            ↻ Actualiser
        </button>

    </div>
                
                           
    <div class="orders-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>CLIENT</th>

                    <th>TÉLÉPHONE</th>

                    <th>WILAYA</th>

                    <th>TOTAL</th>

                    <th>STATUT</th>

                    <th></th>

                </tr>

            </thead>


            <tbody id="ordersTable">

            </tbody>

        </table>

    </div>

</div>



<!-- ==========================
     FENÊTRE DÉTAIL
========================== -->

<div id="orderModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Détails de la commande</h2>

            <button
                class="close"
                onclick="closeModal()">

                ×

            </button>

        </div>


        <div
            id="customerInfo"
            class="customer-info">

        </div>

    </div>

</div>



<script>

let orders = [];

async function validateOrder(id) {

    if (!confirm("Valider cette commande et déduire le stock ?")) {
        return;
    }

    try {

        const response = await fetch(
            `/api/commandes/${id}/valider`,
            {
                method: "POST"
            }
        );

        const texte = await response.text();

        console.log("STATUT HTTP :", response.status);
        console.log("RÉPONSE SERVEUR :", texte);

        let data;

        try {
            data = JSON.parse(texte);
        } catch (e) {
            alert(
                "Erreur serveur :\n\n" +
                "HTTP " + response.status +
                "\n\n" +
                texte
            );
            return;
        }

        if (!response.ok) {
            alert(
                data.message ||
                "Erreur lors de la validation."
            );
            return;
        }

        alert(
            "✓ Commande validée.\n" +
            "Le stock a été mis à jour."
        );

        loadOrders();

    } catch (error) {

        console.error(
            "ERREUR :",
            error
        );

        alert(
            "Erreur de connexion au serveur :\n\n" +
            error.message
        );
    }
}



// ========================================
// CHARGER LES COMMANDES
// ========================================

async function loadOrders() {

    try {

        const response =
            await fetch("/api/commandes");


        if (!response.ok) {

            throw new Error(
                "Erreur serveur"
            );

        }


        orders =
            await response.json();


        displayOrders();


    } catch (error) {

        console.error(error);

        alert(
            "Impossible de récupérer les commandes."
        );

    }

}



// ========================================
// AFFICHER LES COMMANDES
// ========================================

function displayOrders() {

    const table =
        document.getElementById("ordersTable");


    table.innerHTML = "";


    if (orders.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    Aucune commande reçue.

                </td>

            </tr>

        `;

        return;

    }


    orders.forEach(order => {


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>

                <span class="order-id">

                    #${order.id}

                </span>

            </td>


            <td>

                ${order.prenom}
                ${order.nom}

            </td>


            <td>

                ${order.telephone}

            </td>


            <td>

                ${order.wilaya}

            </td>


            <td class="total">

                ${Number(order.total)
                    .toLocaleString()}
                DA

            </td>


            <td>

                <select
                    class="status"
                    onchange="
                        changeStatus(
                            ${order.id},
                            this.value
                        )
                    ">

                    <option
                        value="Nouvelle"
                        ${order.statut === "Nouvelle"
                            ? "selected"
                            : ""}>

                        Nouvelle

                    </option>


                    <option
                        value="Confirmée"
                        ${order.statut === "Confirmée"
                            ? "selected"
                            : ""}>

                        Confirmée

                    </option>


                    <option
                        value="En préparation"
                        ${order.statut === "En préparation"
                            ? "selected"
                            : ""}>

                        En préparation

                    </option>


                    <option
                        value="Expédiée"
                        ${order.statut === "Expédiée"
                            ? "selected"
                            : ""}>

                        Expédiée

                    </option>


                    <option
                        value="Livrée"
                        ${order.statut === "Livrée"
                            ? "selected"
                            : ""}>

                        Livrée

                    </option>


                    <option
                        value="Annulée"
                        ${order.statut === "Annulée"
                            ? "selected"
                            : ""}>

                        Annulée

                    </option>

                </select>

            </td>


            <td>

                <button
                    class="details-button"
                    onclick="
                        openOrderDetails(${order.id})
                    ">

                    Détails

                </button>

                ${
                    order.statut === "Livrée" &&
                    Number(order.stock_deduit) === 0
                    ? `
                        <button
                            class="validate-order-btn"
                            onclick="validateOrder(${order.id})">

                            ✓ Valider

                        </button>
          `
                    : ""
                }

            </td>

        `;


        table.appendChild(row);

    });

}


// ========================================
// DÉTAILS CLIENT
// ========================================

function openOrderDetails(id) {

    window.location.href =
        `commande-details.html?id=${id}`;


}


// ========================================
// FERMER
// ========================================

function closeModal() {

    document.getElementById(
        "orderModal"
    ).style.display = "none";

}



// ========================================
// CHANGER LE STATUT
// ========================================

async function changeStatus(id, statut) {

    try {

        const response =
            await fetch(
                `/api/commandes/${id}/statut`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        statut: statut
                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Erreur modification statut"
            );

        }


        // Mettre à jour localement

        const order =
            orders.find(
                o => Number(o.id) === Number(id)
            );


        if (order) {

            order.statut = statut;
            displayOrders();

        }


    } catch (error) {

        console.error(error);

        alert(
            "Impossible de modifier le statut."
        );

        loadOrders();

    }

}

// ========================================
// CHARGEMENT INITIAL
// ========================================

loadOrders();

</script>


</body>

</html>
