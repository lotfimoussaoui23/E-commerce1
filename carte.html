<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon panier</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="cartHeader">

        <a href="index.html" class="cartLogo">
            🛍️ MA BOUTIQUE
        </a>

        <a href="index.html" class="continueShopping">
            ← Continuer mes achats
        </a>

    </header>


    <!-- CONTENU -->

    <main class="cartPage">

        <!-- =========================
             GAUCHE : PANIER
        ========================== -->

        <section class="cartProducts">

            <h1>VOTRE COMMANDE</h1>

            <div class="cartTitles">
                <span></span>
                <span>PRODUIT</span>
                <span>PRIX</span>
                <span>QUANTITÉ</span>
                <span>TOTAL</span>
                <span></span>

            </div>

            <div id="cartItems"></div>


            <div class="cartTotal">

                <span>TOTAL :</span>

                <strong id="cartTotal">
                    0 DA
                </strong>

            </div>

        </section>


        <!-- =========================
             DROITE : INFORMATIONS
        ========================== -->

        <section class="customerForm">

            <h1>FACTURATION & EXPÉDITION</h1>

            <form id="orderForm">

                <div class="formRow">

                    <div>
                        <label>Prénom *</label>

                        <input
                            type="text"
                            id="prenom"
                            required
                        >
                    </div>


                    <div>
                        <label>Nom *</label>

                        <input
                            type="text"
                            id="nom"
                            required
                        >
                    </div>

                </div>


                <div class="formRow">

                    <div>
                        <label>Wilaya *</label>

                        <select id="wilaya" required>

                            <option value="">
                                Sélectionner une wilaya
                            </option>

                            <option>Adrar</option>
                            <option>Alger</option>
                            <option>Annaba</option>
                            <option>Batna</option>
                            <option>Béjaïa</option>
                            <option>Blida</option>
                            <option>Bordj Bou Arreridj</option>
                            <option>Constantine</option>
                            <option>Djelfa</option>
                            <option>Oran</option>
                            <option>Sétif</option>
                            <option>Tlemcen</option>

                        </select>
                    </div>


                    <div>
                        <label>Ville *</label>

                        <input
                            type="text"
                            id="ville"
                            required
                        >
                    </div>

                </div>


                <div class="formGroup">

                    <label>Adresse *</label>

                    <textarea
                        id="adresse"
                        rows="3"
                        required
                    ></textarea>

                </div>


                <div class="formRow">

                    <div>
                        <label>Code postal</label>

                        <input
                            type="text"
                            id="codePostal"
                        >
                    </div>


                    <div>
                        <label>Téléphone *</label>

                        <input
                            type="tel"
                            id="telephone"
                            required
                        >
                    </div>

                </div>


                <div class="formGroup">

                    <label>E-mail</label>

                    <input
                        type="email"
                        id="email"
                    >

                </div>


                <div class="formGroup">

                    <label>Notes de commande</label>

                    <textarea
                        id="notes"
                        rows="4"
                        placeholder="Commentaires concernant votre commande..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="orderButton">

                    VALIDER LA COMMANDE

                </button>

            </form>

        </section>

    </main>


    <script src="carte.js"></script>

</body>

</html>
